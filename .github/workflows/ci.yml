name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A .gitignore rule once excluded packaging/espec.spec, so the release
      # build failed on a file that was present locally and absent in git.
      # Check the packaging inputs are actually tracked.
      - name: Packaging files are committed
        shell: bash
        run: |
          missing=0
          for f in packaging/espec.spec packaging/windows/espec.iss \
                   packaging/windows/espec.ico packaging/linux/build-deb.sh \
                   packaging/linux/espec-burn-in.desktop \
                   packaging/linux/espec-burn-in.png \
                   packaging/release-notes.md tools/screenshots.py; do
            if [ -z "$(git ls-files "$f")" ]; then
              echo "::error::$f is not tracked by git - the release build needs it"
              missing=1
            fi
          done
          exit $missing

      - name: Lint
        run: ruff check espec_burnin tests

      # The pty-backed chamber simulator is POSIX only; those tests skip on
      # Windows, which is why they also run on ubuntu.
      - name: Test
        run: pytest -q
