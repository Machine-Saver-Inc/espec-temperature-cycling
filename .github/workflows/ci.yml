name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # PySide6 ships its own Qt, but Qt still needs these system libraries.
      # Without them the package imports and the first QtWidgets import fails,
      # which is a collection error, not a test failure.
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxkbcommon0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # A .gitignore rule once excluded packaging/espec.spec, so the release
      # build failed on a file that was present locally and absent in git.
      # Check the packaging inputs are actually tracked.
      - name: Packaging files are committed
        shell: bash
        run: |
          missing=0
          for f in packaging/espec.spec packaging/windows/espec.iss \
                   packaging/windows/espec.ico packaging/linux/build-deb.sh \
                   packaging/linux/espec-burn-in.desktop \
                   packaging/linux/espec-burn-in.png \
                   packaging/release-notes.md tools/screenshots.py \
                   tools/analyse_measurement.py; do
            if [ -z "$(git ls-files "$f")" ]; then
              echo "::error::$f is not tracked by git - the release build needs it"
              missing=1
            fi
          done
          exit $missing

      - name: Lint
        run: ruff check espec_burnin tests

      # The pty-backed chamber simulator is POSIX only; those tests skip on
      # Windows, which is why they also run on ubuntu.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      # importorskip would quietly skip the interface tests if Qt could not
      # load. On Linux we install the libraries above, so a skip there means
      # something is wrong - fail instead of shipping untested screens.
      - name: Interface tests actually ran
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          out=$(pytest tests/test_ui_smoke.py -q --no-header -p no:cacheprovider)
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::the interface tests were skipped - Qt could not load"
            exit 1
          fi
