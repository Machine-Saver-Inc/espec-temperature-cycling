name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      # One source of truth: a build can never disagree with its tag.
      - name: Stamp the version
        shell: bash
        run: |
          printf '__version__ = "%s"\n' "$VERSION" > espec_burnin/_version.py
          cat espec_burnin/_version.py

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean packaging/espec.spec

      # --- Windows -------------------------------------------------------
      # Inno Setup is NOT preinstalled on the GitHub Windows runners.
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $out = Join-Path $PWD 'dist'
          & $iscc "/DAppVersion=$env:VERSION" "/O$out" 'packaging\windows\espec.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem dist -Filter *.exe | ForEach-Object { Write-Host $_.Name }

      # --- Linux ---------------------------------------------------------
      - name: Build the .deb
        if: runner.os == 'Linux'
        run: bash packaging/linux/build-deb.sh "$VERSION"

      - name: Build the AppImage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends desktop-file-utils file
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool

          APPDIR=EspecBurnIn.AppDir
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r dist/EspecBurnIn/. "$APPDIR/usr/bin/"
          sed 's|^Exec=.*|Exec=EspecBurnIn|' packaging/linux/espec-burn-in.desktop \
            > "$APPDIR/espec-burn-in.desktop"
          cp "$APPDIR/espec-burn-in.desktop" "$APPDIR/usr/share/applications/"
          cp packaging/linux/espec-burn-in.png "$APPDIR/espec-burn-in.png"
          cp packaging/linux/espec-burn-in.png \
             "$APPDIR/usr/share/icons/hicolor/256x256/apps/"
          printf '#!/bin/sh\nexec "$(dirname "$0")/usr/bin/EspecBurnIn" "$@"\n' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # The runner has no FUSE, so run appimagetool by extracting it instead.
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool --no-appstream \
            "$APPDIR" "dist/EspecBurnIn-$VERSION-x86_64.AppImage"

      - name: Collect the artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -la out
          test -n "$(ls -A out)" || { echo "no artifacts were produced"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A push that times out can leave the tag pointing at a commit that is
      # on no branch, and the release then ships code nobody can find. This
      # used to be a step someone remembered between two pushes.
      - name: The tag is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on "\
                 "main. Push main first, confirm it landed, then tag."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: Resolve the version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          fi

      - name: Gather and checksum
        run: |
          mkdir -p out
          find staged -type f -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          ls -la

      # SHA256SUMS is what the in-app updater checks downloads against, so it
      # has to be attached to every release.
      # The release page is where people land to download, so it carries the
      # install instructions rather than just a commit list.
      # What's new first, then how to install it. Someone who pressed What's
      # new inside the program was handed install instructions for software
      # they were already running (issue #8).
      - name: Build the release notes
        run: python tools/release_notes.py "$VERSION" > out/NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Espec Burn-In v${{ env.VERSION }}
          body_path: out/NOTES.md
          files: |
            out/*.exe
            out/*.deb
            out/*.AppImage
            out/SHA256SUMS
          fail_on_unmatched_files: false

      # Download what was just published, anonymously, and check it against the
      # checksums that went up with it. Uploading is not the same as being
      # downloadable, and the in-app updater refuses anything that does not
      # match - better to find that here than on a bench.
      - name: Verify the published assets
        shell: bash
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}"
          mkdir -p verify && cd verify
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          while read -r _ name; do
            echo "fetching $name"
            curl -fsSL -o "$name" "$base/$name"
          done < SHA256SUMS
          sha256sum -c SHA256SUMS
          file ./*.exe | grep -q "PE32" \
            || { echo "::error::the published .exe is not a Windows binary"; exit 1; }
          echo "every published asset matches its checksum."
